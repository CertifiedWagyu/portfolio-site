<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t !== "dark" && t !== "light") {
          var h = new Date().getHours();
          t = h >= 7 && h < 19 ? "light" : "dark";
        }
        if (t === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    </script>
    <title>Delmart B. Asensi</title>
    <meta name="description" content="Personal website of Delmart B. Asensi, 3rd Year BSIT Student at Assumption College of Davao, Davao City" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=Space+Grotesk:wght@300..700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html.is-booting {
        overflow: hidden;
      }
      #boot {
        --boot-bg: #fafafa;
        --boot-ink: #09090b;
        --boot-accent: #2563eb;
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: clamp(18px, 4vw, 44px);
        background: var(--boot-bg);
        color: var(--boot-ink);
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
        transition: transform 480ms cubic-bezier(0.76, 0, 0.24, 1);
        will-change: transform;
      }
      html.dark #boot {
        --boot-bg: #0a0a0a;
        --boot-ink: #fafafa;
        --boot-accent: #60a5fa;
      }
      #boot.is-done {
        transform: translateY(-101%);
      }
      #boot::after {
        content: "";
        position: absolute;
        inset: clamp(10px, 2vw, 22px);
        border: 2px solid currentColor;
        pointer-events: none;
        opacity: 0.16;
      }
      .boot-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        font-size: clamp(9px, 1vw, 11px);
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        opacity: 0.7;
      }
      .boot-mid {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .boot-kicker {
        margin: 0;
        font-size: clamp(9px, 1vw, 11px);
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        opacity: 0.7;
      }
      .boot-name {
        margin: 0;
        font-family: "Archivo", "Arial Black", Impact, system-ui, sans-serif;
        font-weight: 900;
        font-size: clamp(42px, 12.5vw, 132px);
        line-height: 0.86;
        letter-spacing: -0.045em;
        text-transform: uppercase;
      }
      .boot-name span {
        display: inline-block;
        margin-top: 0.06em;
        padding: 0 0.08em;
        background: var(--boot-accent);
        color: var(--boot-bg);
      }
      .boot-meter {
        height: clamp(10px, 1.4vw, 16px);
        border: 2px solid currentColor;
        margin-bottom: 10px;
      }
      .boot-meter i {
        display: block;
        height: 100%;
        background: var(--boot-accent);
        transform: scaleX(0.02);
        transform-origin: left center;
        transition: transform 120ms steps(3, end);
      }
      .boot-meta {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        font-size: clamp(9px, 1vw, 11px);
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      .boot-meta b {
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot {
          display: none;
        }
      }
    </style>
    <noscript><style>#boot { display: none !important; }</style></noscript>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="boot-row">
        <span>Portfolio / 2026</span>
        <span>Davao City · PHT</span>
      </div>
      <div class="boot-mid">
        <p class="boot-kicker">Subject / 001</p>
        <p class="boot-name">Delmart<br /><span>B. Asensi</span></p>
      </div>
      <div>
        <div class="boot-meter"><i id="boot-bar"></i></div>
        <div class="boot-meta">
          <span>Portrait.core-001</span>
          <span><b id="boot-pct">000</b> %</span>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var el = document.getElementById("boot");
        if (!el) return;
        var bar = document.getElementById("boot-bar");
        var pct = document.getElementById("boot-pct");
        var reduce = false;
        try {
          reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        } catch (e) {}
        if (reduce || location.pathname.indexOf("/admin") === 0) {
          el.remove();
          return;
        }
        document.documentElement.classList.add("is-booting");

        var start = performance.now();
        var MIN = 950;
        var CAP = 3200;
        var loaded = false;
        var finished = false;
        var held = 0;

        window.addEventListener("load", function () {
          loaded = true;
        });

        function finish() {
          if (finished) return;
          finished = true;
          bar.style.transform = "scaleX(1)";
          pct.textContent = "100";
          document.documentElement.classList.remove("is-booting");
          el.classList.add("is-done");
          window.setTimeout(function () {
            el.remove();
          }, 560);
        }

        function tick() {
          if (finished) return;
          var elapsed = performance.now() - start;
          var target = Math.min(1, elapsed / MIN);
          if (!loaded) target = Math.min(target, 0.9);
          var shown = Math.round((1 - Math.pow(1 - target, 2)) * 100);
          if (shown >= held) {
            held = shown;
            pct.textContent = ("00" + shown).slice(-3);
            bar.style.transform = "scaleX(" + Math.max(0.02, target) + ")";
          }
          if ((loaded && elapsed >= MIN) || elapsed >= CAP) {
            finish();
          }
        }

        var timer = window.setInterval(tick, 40);
        tick();
        window.addEventListener("load", tick);
        window.setTimeout(function () {
          window.clearInterval(timer);
          finish();
        }, CAP + 800);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
