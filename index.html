<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t !== "dark" && t !== "light") {
          var h = new Date().getHours();
          t = h >= 7 && h < 19 ? "light" : "dark";
        }
        if (t === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    </script>
    <title>Delmart B. Asensi</title>
    <meta name="description" content="Personal website of Delmart B. Asensi, 3rd Year BSIT Student at Assumption College of Davao, Davao City" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=Space+Grotesk:wght@300..700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html.is-booting {
        overflow: hidden;
      }
      #boot {
        --boot-bg: #fafafa;
        --boot-ink: #09090b;
        --boot-accent: #2563eb;
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: transparent;
        color: var(--boot-ink);
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
        overflow: hidden;
      }
      html.dark #boot {
        --boot-bg: #0a0a0a;
        --boot-ink: #fafafa;
        --boot-accent: #60a5fa;
      }
      .boot-inner {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: clamp(18px, 4vw, 44px);
      }
      .boot-inner::after {
        content: "";
        position: absolute;
        inset: clamp(10px, 2vw, 22px);
        border: 2px solid currentColor;
        opacity: 0.16;
        pointer-events: none;
      }
      .boot-inner::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: -2px;
        height: 2px;
        background: var(--boot-accent);
        animation: boot-scan 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes boot-scan {
        0% {
          transform: translateY(0);
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        90% {
          opacity: 1;
        }
        100% {
          transform: translateY(100vh);
          opacity: 0;
        }
      }
      .boot-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        font-size: clamp(9px, 1vw, 11px);
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        opacity: 0.7;
      }
      .boot-row i {
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-right: 8px;
        background: var(--boot-accent);
        animation: boot-blink 900ms steps(2, end) infinite;
      }
      @keyframes boot-blink {
        0%,
        49% {
          opacity: 1;
        }
        50%,
        100% {
          opacity: 0.15;
        }
      }
      .boot-core {
        display: flex;
        flex-direction: column;
        gap: clamp(6px, 1vw, 14px);
      }
      .boot-kicker {
        margin: 0;
        font-size: clamp(9px, 1vw, 11px);
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        opacity: 0.7;
      }
      .boot-count {
        display: flex;
        align-items: flex-start;
        gap: 0.06em;
        font-family: "Archivo", "Arial Black", Impact, system-ui, sans-serif;
        font-weight: 900;
        font-size: clamp(64px, 17vw, 210px);
        line-height: 0.78;
        letter-spacing: -0.05em;
        font-variant-numeric: tabular-nums;
      }
      .boot-count em {
        font-style: normal;
        font-size: 0.2em;
        letter-spacing: 0.1em;
        padding-top: 0.35em;
        opacity: 0.45;
      }
      .boot-glyphs {
        margin: 0;
        font-size: clamp(9px, 1.1vw, 12px);
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        opacity: 0.55;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: clip;
      }
      .boot-foot {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .boot-meter {
        position: relative;
        height: clamp(10px, 1.3vw, 16px);
        border: 2px solid currentColor;
        overflow: hidden;
      }
      .boot-meter i {
        position: absolute;
        inset: 0;
        background: var(--boot-accent);
        transform: scaleX(0.01);
        transform-origin: left center;
        transition: transform 140ms steps(4, end);
      }
      .boot-meter::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image: repeating-linear-gradient(
          90deg,
          transparent 0 8px,
          var(--boot-bg) 8px 10px
        );
      }
      .boot-meta {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        font-size: clamp(9px, 1vw, 11px);
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      .boot-meta span:first-child {
        color: var(--boot-accent);
      }
      .boot-bars {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        pointer-events: none;
      }
      .boot-bars i {
        flex: 1;
        background: var(--boot-bg);
        transition: transform 430ms cubic-bezier(0.76, 0, 0.24, 1);
      }
      #boot.is-done .boot-inner {
        opacity: 0;
        transition: opacity 110ms linear;
      }
      #boot.is-done .boot-bars i {
        transform: translateX(101%);
      }
      #boot.is-done .boot-bars i:nth-child(odd) {
        transform: translateX(-101%);
      }
      #boot.is-done .boot-bars i:nth-child(1) {
        transition-delay: 0ms;
      }
      #boot.is-done .boot-bars i:nth-child(2) {
        transition-delay: 55ms;
      }
      #boot.is-done .boot-bars i:nth-child(3) {
        transition-delay: 110ms;
      }
      #boot.is-done .boot-bars i:nth-child(4) {
        transition-delay: 165ms;
      }
      #boot.is-done .boot-bars i:nth-child(5) {
        transition-delay: 220ms;
      }
      #boot.is-done .boot-bars i:nth-child(6) {
        transition-delay: 275ms;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot {
          display: none;
        }
      }
    </style>
    <noscript><style>#boot { display: none !important; }</style></noscript>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="boot-inner">
        <div class="boot-row">
          <span><i></i>Index / 001</span>
          <span>Davao City · PHT</span>
        </div>

        <div class="boot-core">
          <p class="boot-kicker">Live render · ASCII.scan</p>
          <div class="boot-count"><span id="boot-pct">000</span><em>%</em></div>
          <p class="boot-glyphs" id="boot-glyphs">Glyph 0x000000 · Signal 00.00</p>
        </div>

        <div class="boot-foot">
          <div class="boot-meter"><i id="boot-bar"></i></div>
          <div class="boot-meta">
            <span id="boot-status">Calibrating portrait</span>
            <span>Portrait.core-001</span>
          </div>
        </div>
      </div>
      <div class="boot-bars">
        <i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
    </div>
    <script>
      (function () {
        var el = document.getElementById("boot");
        if (!el) return;
        var bar = document.getElementById("boot-bar");
        var pct = document.getElementById("boot-pct");
        var status = document.getElementById("boot-status");
        var glyphs = document.getElementById("boot-glyphs");
        var reduce = false;
        try {
          reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        } catch (e) {}
        if (reduce || location.pathname.indexOf("/admin") === 0) {
          el.remove();
          return;
        }
        document.documentElement.classList.add("is-booting");

        var start = performance.now();
        var MIN = 1050;
        var CAP = 3400;
        var loaded = false;
        var finished = false;
        var held = 0;
        var lastGlyph = 0;

        function hex(len) {
          var s = "";
          for (var i = 0; i < len; i++) {
            s += "0123456789ABCDEF".charAt(Math.floor(Math.random() * 16));
          }
          return s;
        }

        window.addEventListener("load", function () {
          loaded = true;
        });

        function finish() {
          if (finished) return;
          finished = true;
          bar.style.transform = "scaleX(1)";
          pct.textContent = "100";
          status.textContent = "Signal locked";
          glyphs.textContent = "Glyph 0xFFFFFF · Signal 100.00";
          document.documentElement.classList.remove("is-booting");
          el.classList.add("is-done");
          window.setTimeout(function () {
            el.remove();
          }, 980);
        }

        function tick() {
          if (finished) return;
          var elapsed = performance.now() - start;
          var target = Math.min(1, elapsed / MIN);
          if (!loaded) target = Math.min(target, 0.9);
          var shown = Math.round((1 - Math.pow(1 - target, 2)) * 100);
          if (shown >= held) {
            held = shown;
            pct.textContent = ("00" + shown).slice(-3);
            bar.style.transform = "scaleX(" + Math.max(0.01, target) + ")";
            status.textContent =
              shown < 35
                ? "Calibrating portrait"
                : shown < 70
                  ? "Sampling glyphs"
                  : shown < 97
                    ? "Dithering 16m"
                    : "Locking signal";
            if (elapsed - lastGlyph > 90) {
              lastGlyph = elapsed;
              glyphs.textContent =
                "Glyph 0x" + hex(6) + " · Signal " + (95 + Math.random() * 4.9).toFixed(2);
            }
          }
          if ((loaded && elapsed >= MIN) || elapsed >= CAP) {
            finish();
          }
        }

        var timer = window.setInterval(tick, 40);
        tick();
        window.addEventListener("load", tick);
        window.setTimeout(function () {
          window.clearInterval(timer);
          finish();
        }, CAP + 800);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
